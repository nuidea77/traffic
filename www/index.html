<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>УБ Түгжрэлийн маршрут — Гэр хорооллын замаар тойрох</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Дээд хөвөгч самбар -->
  <div id="top-panel">
    <div class="brand">Түгжрэл тойрох <span class="brand-badge">AI</span></div>

    <div class="point-row">
      <span class="dot dot-start"></span>
      <input id="start-input" type="text" placeholder="Эхлэх цэг…" />
      <button id="start-search" class="icon-btn" title="Хайх"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button id="locate-btn" class="icon-btn" title="Миний байршлаас эхлэх"><i class="fa-solid fa-location-crosshairs"></i></button>
    </div>
    <div class="point-row">
      <span class="dot dot-end"></span>
      <input id="end-input" type="text" placeholder="Очих цэг…" />
      <button id="end-search" class="icon-btn" title="Хайх"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button id="clear-btn" class="icon-btn" title="Цэгүүдийг арилгах"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="search-results"></div>

    <div id="traffic-levels" class="chips">
      <button data-level="auto"   class="level-btn chip active" title="AI загвар одоогийн гараг, цагаас түгжрэлийг таамаглана"><i class="fa-solid fa-robot"></i> AI</button>
      <button data-level="free"   class="level-btn chip"><i class="fa-solid fa-circle lv-free"></i> Чөлөөтэй</button>
      <button data-level="normal" class="level-btn chip"><i class="fa-solid fa-circle lv-normal"></i> Хэвийн</button>
      <button data-level="busy"   class="level-btn chip"><i class="fa-solid fa-circle lv-busy"></i> Ачаалалтай</button>
      <button data-level="jam"    class="level-btn chip"><i class="fa-solid fa-circle lv-jam"></i> Түгжрэлтэй</button>
    </div>
    <p id="auto-level-info" class="mini"></p>

    <button id="route-btn" disabled><i class="fa-solid fa-route"></i> Маршрут гаргах</button>

    <details id="ai-details">
      <summary><i class="fa-solid fa-robot"></i> AI загвар ба хэмжилт</summary>
      <p id="model-status" class="mini">Загвар ачаалж байна…</p>
      <div class="chips">
        <button id="drive-btn" class="chip"><i class="fa-solid fa-car-side"></i> Хэмжилт эхлүүлэх</button>
        <button id="export-btn" class="chip"><i class="fa-solid fa-download"></i> CSV экспорт</button>
      </div>
      <p id="collect-info" class="mini"></p>
    </details>
  </div>

  <div id="status"></div>

  <!-- Доод хөвөгч үр дүнгийн карт -->
  <div id="results" class="bottom-card hidden">
    <div class="card-head">
      <div class="thumb"><i class="fa-solid fa-bolt"></i></div>
      <div class="card-main">
        <div class="card-title">Ухаалаг маршрут</div>
        <div class="stats-row">
          <div class="stat"><span>Зай</span><b id="smart-dist"></b></div>
          <div class="stat"><span>Хугацаа</span><b id="smart-time"></b></div>
          <div class="stat"><span>Хэмнэлт</span><b id="saved-min">—</b></div>
        </div>
      </div>
      <button id="card-toggle" class="card-arrow" title="Дэлгэрэнгүй"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
    <div id="card-details" class="hidden">
      <div id="smart-breakdown" class="breakdown"></div>
      <div class="divider"></div>
      <div class="compare">
        <span class="line-swatch"></span>
        Гол замын маршрут: <b id="main-time"></b> · <span id="main-dist"></span>
        <div id="main-breakdown" class="breakdown"></div>
      </div>
      <div id="savings" class="savings"></div>
      <p class="credit">© OpenStreetMap contributors · CARTO · Overpass API</p>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/router.js"></script>
  <script src="js/model.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
